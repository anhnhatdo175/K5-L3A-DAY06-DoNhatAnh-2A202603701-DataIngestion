services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day6_lab
      POSTGRES_USER: day6
      POSTGRES_PASSWORD: day6_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day6 -d day6_lab"]
      interval: 3s
      timeout: 3s
      retries: 30

  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/starter
    environment:
      DATABASE_URL: postgresql://day6:day6_local_only@postgres:5432/day6_lab
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - ..:/workspace
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  fastembed_cache:
